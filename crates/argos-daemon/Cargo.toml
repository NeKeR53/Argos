[package]
name = "argos-daemon"
description = "Daemon headless Argos : sessions d'agents, contrôle, mémoire, API"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
argos-core.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
croner = "4"
futures-util = "0.3"
libc = "0.2"
notify = "8"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
toml = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
