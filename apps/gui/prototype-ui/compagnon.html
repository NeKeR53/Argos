/div><footer class="chat-foot"><form class="composer"><input id="message" aria-label="Message" autocomplete="off"><button class="send" aria-label="Envoyer">↑</button></form></footer></main></div><nav class="switcher" aria-label="Variantes visuelles"><small>PROTOTYPE</small><a href="focus.html" class="">01 Sobre</a><a href="atelier.html" class="">02 Chaleureux</a><a href="compagnon.html" class="current">03 Souple</a><a href="regie.html" class="">04 Contrasté</a></nav><script>const data={"Assistant": ["O\u00f9 en sommes-nous ?", "Design a pr\u00e9par\u00e9 deux pistes. Recherche termine sa s\u00e9lection.", "Voir les pistes", "Design \u00b7 2 aper\u00e7us"], "Design": ["Une page plus simple, avec plus de caract\u00e8re.", "J\u2019ai all\u00e9g\u00e9 la structure et laiss\u00e9 plus de place au contenu. Deux pistes sont pr\u00eates.", "Deux pistes \u00e0 comparer", "\u00c9ditorial \u00b7 Essentiel"], "Recherche": ["Garde seulement les r\u00e9f\u00e9rences les plus utiles.", "J\u2019en ai retenu six. Chacune apporte quelque chose de diff\u00e9rent.", "Ouvrir la s\u00e9lection", "6 r\u00e9f\u00e9rences"], "Documents": ["Tu peux ranger les notes de la semaine ?", "C\u2019est fait. Les notes sont regroup\u00e9es et les doublons retir\u00e9s.", "Voir les documents", "3 dossiers"]};let selected='Design';let drafts={};const histories={};function draw(){document.querySelector('#agent-name').textContent=selected;document.querySelectorAll('[data-agent]').forEach(b=>{b.classList.toggle('active',b.dataset.agent===selected);b.setAttribute('aria-pressed',b.dataset.agent===selected)});let d=data[selected];['question','answer','result-title','result-subtitle'].forEach((id,n)=>document.getElementById(id).textContent=d[n]);let i=document.querySelector('#message');i.placeholder='Écrire à '+selected+'…';i.value=drafts[selected]||'';document.querySelector('#history').replaceChildren(...(histories[selected]||[]));document.querySelector('#reply-orb').classList.remove('busy');document.querySelector('#menu')?.remove();document.querySelector('.detail-panel')?.remove()}function panel(title,html){document.querySelector('#menu')?.remove();document.querySelector('.detail-panel')?.remove();let p=document.createElement('aside');p.className='detail-panel';p.setAttribute('aria-label',title);p.innerHTML='<div class="panel-head"><h2>'+title+'</h2><button class="icon-button" aria-label="Fermer le panneau">×</button></div>'+html;document.body.append(p);p.querySelector('.icon-button').onclick=()=>p.remove()}function settings(){panel('Réglages','<div class="panel-tabs"><button class="selected" data-setting="general">Général</button><button data-setting="agent">Cet agent</button></div><div id="settings-content"></div><p class="panel-copy" style="margin-top:28px">Maquette · réglages simulés</p>');setting('general')}function setting(tab){document.querySelectorAll('[data-setting]').forEach(b=>b.classList.toggle('selected',b.dataset.setting===tab));document.querySelector('#settings-content').innerHTML=tab==='general'?'<label class="setting">Animations<input id="motion" type="checkbox" checked></label><label class="setting">Sons<input type="checkbox"></label><div class="setting">Raccourcis<small>Entrée · envoyer</small></div><button class="setting" style="width:100%" id="dock">Petit bonhomme dans le Dock <span>↗</span></button>':'<label class="setting">Modèle<select><option>Automatique</option><option>Rapide</option><option>Approfondi</option></select></label><div class="setting">Espace de travail<small>Argos</small></div><div class="setting">Nœud<small>Local</small></div><div class="setting">Session<small>Connectée</small></div>'}document.addEventListener('click',e=>{let b=e.target.closest('button');if(b?.dataset.agent){drafts[selected]=document.querySelector('#message').value;selected=b.dataset.agent;draw()}if(b?.id==='settings')settings();if(b?.dataset.setting)setting(b.dataset.setting);if(b?.id==='more'){if(document.querySelector('#menu')){document.querySelector('#menu').remove();return}let m=document.createElement('div');m.id='menu';m.className='popover';m.innerHTML='<button data-action="mission">Mission</button><button data-action="triggers">Déclencheurs</button><button data-action="details">Détails de l’agent</button><button data-action="pause">Mettre en pause</button>';document.body.append(m)}if(b?.dataset.action){let a=b.dataset.action;if(a==='mission')panel('Mission','<p class="panel-copy">Simplifier l’interface et préparer deux directions visuelles.</p><div class="setting">Structure<small>✓ Terminée</small></div><div class="setting">Propositions<small>✓ Prêtes</small></div><div class="setting">Direction<small>À valider</small></div>');if(a==='triggers')panel('Déclencheurs','<label class="setting">Veille quotidienne<input type="checkbox" checked></label><p class="panel-copy">Chaque matin à 9 h.</p>');if(a==='details'){settings();setting('agent')}if(a==='pause')panel('Agent en pause','<p class="panel-copy">'+selected+' reprendra au prochain message.</p>')}if(b?.id==='result')panel(data[selected][2],'<p class="panel-copy">Résultats de '+selected+'</p><div class="art" style="margin-top:25px"><strong>Less,<br>but better.</strong><i></i></div><div class="art alt" style="margin-top:15px"><strong>Make room.<br>For more.</strong><i></i></div>');if(b?.id==='dock')panel('Le petit bonhomme','<p class="panel-copy">Aperçu de l’icône animée du Dock.</p><div class="dock-preview"><span class="dock-item"></span><span class="orb" id="dock-mascot"></span><span class="dock-item"></span></div><div class="dock-actions"><button data-mood="idle">Au repos</button><button data-mood="busy">Au travail</button><button data-mood="done">Terminé</button></div>');if(b?.dataset.mood){let o=document.querySelector('#dock-mascot');o.classList.toggle('busy',b.dataset.mood==='busy');o.style.background=b.dataset.mood==='done'?'#b1c89a':'';if(b.dataset.mood==='done')o.animate([{transform:'scale(1)'},{transform:'translateY(-12px) rotate(-10deg)'},{transform:'scale(1)'}],{duration:550})}if(!e.target.closest('#more')&&!e.target.closest('#menu'))document.querySelector('#menu')?.remove()});document.querySelector('form').onsubmit=e=>{e.preventDefault();let i=document.querySelector('#message');if(!i.value.trim())return;let agent=selected,p=document.createElement('p');p.className='user sent-message';p.textContent=i.value;(histories[agent]??=[]).push(p);document.querySelector('#history').append(p);i.value='';drafts[agent]='';document.querySelector('#reply-orb').classList.add('busy');setTimeout(()=>{let r=document.createElement('p');r.className='assistant-response';r.textContent='Bien reçu. Je m’en occupe.';histories[agent].push(r);if(selected===agent){document.querySelector('#history').append(r);document.querySelector('#reply-orb').classList.remove('busy');r.scrollIntoView({block:'nearest',behavior:'smooth'})}},650)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('.detail-panel')?.remove();document.querySelector('#menu')?.remove()}});document.addEventListener('change',e=>{if(e.target.id==='motion'){let old=document.querySelector('#motion-style');old?.remove();if(!e.target.checked){let s=document.createElement('style');s.id='motion-style';s.textContent='*,*:before,*:after{animation:none!important;transition:none!important}';document.head.append(s)}}});draw();</script></body></html>
