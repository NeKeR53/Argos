[workspace]
resolver = "3"
members = ["crates/argos-core", "crates/argos-daemon", "apps/gui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
argos-core = { path = "crates/argos-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Voir https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
