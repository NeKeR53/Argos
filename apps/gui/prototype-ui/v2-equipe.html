<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Argos – Mon équipe</title>
<style>
/* ───────── Tokens ───────── */
:root {
  --bg: #F4F3F0;
  --surface: #FFFFFF;
  --surface-2: #F8F7F4;
  --line: rgba(44, 34, 16, .10);
  --line-strong: rgba(44, 34, 16, .16);
  --ink: #1D1B18;
  --ink-2: #5E5A53;
  --ink-3: #8C877E;
  --accent: #1F7A74;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(31, 122, 116, .10);
  --amber-bg: #FFF4DA;
  --amber-line: #EDD08A;
  --amber-ink: #5F4000;
  --amber-btn: #8F5700;
  --amber-btn-ink: #FFFFFF;
  --danger: #C23B30;
  --scrim: rgba(30, 24, 12, .32);
  --shadow-1: 0 1px 2px rgba(44, 34, 16, .06), 0 0 0 1px rgba(44, 34, 16, .05);
  --shadow-2: 0 1px 2px rgba(44, 34, 16, .08), 0 14px 32px -18px rgba(44, 34, 16, .30), 0 0 0 1px rgba(44, 34, 16, .06);
  --shadow-modal: 0 2px 6px rgba(0, 0, 0, .10), 0 28px 64px -16px rgba(30, 20, 0, .38), 0 0 0 1px rgba(44, 34, 16, .08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #19191A; --surface: #262628; --surface-2: #2D2D30;
    --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .15);
    --ink: #F3F1ED; --ink-2: #B7B2A9; --ink-3: #86817A;
    --accent: #52BDB2; --accent-ink: #04201D; --accent-soft: rgba(82, 189, 178, .14);
    --amber-bg: rgba(255, 189, 46, .11); --amber-line: rgba(255, 189, 46, .28);
    --amber-ink: #FFDA8C; --amber-btn: #FFBD2E; --amber-btn-ink: #3A2600;
    --danger: #FF7A6E; --scrim: rgba(0, 0, 0, .52);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .06);
    --shadow-2: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 32px -18px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .09);
    --shadow-modal: 0 2px 6px rgba(0, 0, 0, .4), 0 28px 64px -16px rgba(0, 0, 0, .75), 0 0 0 1px rgba(255, 255, 255, .10);
  }
}
:root[data-theme="dark"] {
  --bg: #19191A; --surface: #262628; --surface-2: #2D2D30;
  --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .15);
  --ink: #F3F1ED; --ink-2: #B7B2A9; --ink-3: #86817A;
  --accent: #52BDB2; --accent-ink: #04201D; --accent-soft: rgba(82, 189, 178, .14);
  --amber-bg: rgba(255, 189, 46, .11); --amber-line: rgba(255, 189, 46, .28);
  --amber-ink: #FFDA8C; --amber-btn: #FFBD2E; --amber-btn-ink: #3A2600;
  --danger: #FF7A6E; --scrim: rgba(0, 0, 0, .52);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .06);
  --shadow-2: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 32px -18px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .09);
  --shadow-modal: 0 2px 6px rgba(0, 0, 0, .4), 0 28px 64px -16px rgba(0, 0, 0, .75), 0 0 0 1px rgba(255, 255, 255, .10);
}

/* ───────── Base ───────── */
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font: 13px/1.5 var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
svg { display: block; flex: none; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ───────── Barre du haut ───────── */
.toolbar {
  height: 52px; flex: none;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  border-bottom: 1px solid var(--line);
  -webkit-app-region: drag;
}
.tb-left, .tb-right { display: flex; align-items: center; gap: 8px; }
.tb-right { justify-content: flex-end; }
.lights { display: flex; gap: 8px; margin-right: 16px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.tb-title { text-align: center; line-height: 1.25; }
.tb-title b { display: block; font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
.tb-title span { display: block; font-size: 11px; color: var(--ink-3); }
.tb-btn {
  height: 28px; min-width: 28px; padding: 0 6px; border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
  color: var(--ink-2); transition: background .15s, color .15s;
}
.tb-btn:hover { background: var(--line); color: var(--ink); }
.tb-btn .ico { width: 18px; height: 18px; }
.tb-btn.back { padding: 0 10px 0 4px; font-weight: 500; color: var(--accent); }
.tb-btn.back:hover { background: var(--accent-soft); color: var(--accent); }
.tb-btn.back .ico { width: 20px; height: 20px; }
.tb-btn.panic { color: var(--ink-3); }
.tb-btn.panic:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.tb-sep { width: 1px; height: 16px; background: var(--line-strong); margin: 0 4px; }

/* ───────── Vues ───────── */
.views { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; scrollbar-gutter: stable; }
.view.enter { animation: viewIn .22s cubic-bezier(.2, .8, .2, 1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ───────── Accueil ───────── */
.wrap { max-width: 904px; margin: 0 auto; padding: 16px 32px 32px; }
.greet { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
.greet h1 { font-size: 26px; line-height: 32px; font-weight: 650; letter-spacing: -.022em; }
.greet time { color: var(--ink-3); font-size: 13px; }

.assistant { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-1); overflow: hidden; }
.composer { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; }
.mark { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.mark svg { width: 20px; height: 20px; }
.composer input { flex: 1; border: 0; outline: 0; background: none; font-size: 15px; height: 32px; min-width: 0; }
.composer input::placeholder { color: var(--ink-3); }
.round {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2);
  transition: background .15s, color .15s, opacity .15s;
}
.round:hover { background: var(--line); color: var(--ink); }
.round.send { background: var(--accent); color: var(--accent-ink); }
.round.send:hover { background: var(--accent); filter: brightness(1.08); color: var(--accent-ink); }
.round.send:disabled { background: var(--line); color: var(--ink-3); cursor: default; filter: none; }
.round .ico { width: 18px; height: 18px; }

.answer { border-top: 1px solid var(--line); padding: 12px 20px 16px 60px; background: var(--surface-2); }
.answer-meta { color: var(--ink-3); font-size: 12px; margin-bottom: 4px; }
.answer p { font-size: 15px; line-height: 24px; max-width: 70ch; color: var(--ink); letter-spacing: -.003em; }
.answer p + p { margin-top: 8px; }
.mention { font-weight: 600; color: var(--accent); border-radius: 4px; transition: background .15s; }
.mention:hover { background: var(--accent-soft); }
.thinking { display: inline-flex; gap: 4px; padding: 8px 0; }
.thinking i, .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite ease-in-out; }
.thinking i:nth-child(2), .typing i:nth-child(2) { animation-delay: .15s; }
.thinking i:nth-child(3), .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 12px; }
.section-head h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.section-head h2 small { font-weight: 400; color: var(--ink-3); font-size: 13px; margin-left: 8px; letter-spacing: 0; }
.ghost { color: var(--ink-2); height: 28px; padding: 0 10px; border-radius: 7px; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; transition: background .15s; }
.ghost:hover { background: var(--line); color: var(--ink); }
.ghost .ico { width: 16px; height: 16px; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card {
  position: relative; background: var(--surface); border-radius: 16px; padding: 20px;
  box-shadow: var(--shadow-1); display: flex; flex-direction: column;
  transition: box-shadow .2s, transform .2s;
}
.card:hover { box-shadow: var(--shadow-2); }
.card-head { display: flex; gap: 12px; align-items: center; }
.mono { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.mono .ico { width: 22px; height: 22px; }
.card-id { min-width: 0; }
.card-id h3 { font-size: 15px; line-height: 20px; font-weight: 650; letter-spacing: -.01em; }
.card-open { text-align: left; font-weight: inherit; letter-spacing: inherit; }
.card-open::after { content: ""; position: absolute; inset: 0; border-radius: 16px; }
.card-open:focus-visible { outline: none; }
.card:has(.card-open:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.role { color: var(--ink-2); font-size: 13px; line-height: 18px; }
.status { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; color: var(--ink-2); font-size: 13px; line-height: 20px; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-top: 6px; flex: none; opacity: .55; }
.status.s-work { color: var(--ink); }
.status.s-work .dot { background: var(--accent); opacity: 1; animation: pulse 2s infinite; }
.status.s-wait .dot { background: var(--amber-btn); opacity: 1; }
.status.s-stopped { color: var(--ink-3); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }

.ask {
  position: relative; z-index: 1;
  margin-top: 12px; padding: 12px 12px 12px 14px; border-radius: 12px;
  background: var(--amber-bg); box-shadow: inset 0 0 0 1px var(--amber-line); color: var(--amber-ink);
}
.ask-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.ask b { font-size: 12px; font-weight: 650; }
.ask p { font-size: 13px; line-height: 19px; }
.ask .reply {
  height: 28px; padding: 0 14px; border-radius: 8px;
  background: var(--amber-btn); color: var(--amber-btn-ink); font-weight: 600;
  transition: filter .15s;
}
.ask .reply:hover { filter: brightness(1.1); }
.ask .reply:focus-visible { outline-color: var(--amber-btn); }

/* ───────── Vue Agent ───────── */
.thread { max-width: 720px; margin: 0 auto; padding: 24px 24px 24px; display: flex; flex-direction: column; gap: 16px; }
#agent { display: flex; flex-direction: column; overflow: hidden; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.day { text-align: center; color: var(--ink-3); font-size: 12px; margin: 8px 0 0; }
.msg-user { align-self: flex-end; max-width: 72%; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 18px 18px 6px 18px; font-size: 14px; line-height: 21px; }
.msg-agent { max-width: 62ch; font-size: 15px; line-height: 24px; letter-spacing: -.003em; }
.msg-agent p + p { margin-top: 8px; }
.tools { margin-top: -8px; }
.tools-toggle { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 12px; height: 24px; padding: 0 6px 0 0; border-radius: 6px; transition: color .15s; }
.tools-toggle:hover { color: var(--ink-2); }
.tools-toggle svg { width: 12px; height: 12px; transition: transform .18s; stroke-width: 2; }
.tools-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.tools ul { list-style: none; padding: 4px 0 4px 12px; margin: 4px 0 0; border-left: 2px solid var(--line); }
.tools li { color: var(--ink-3); font-size: 12px; line-height: 20px; padding: 2px 0; }
.chips { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.chip {
  height: 32px; padding: 0 14px; border-radius: 16px; font-weight: 500;
  background: var(--surface); box-shadow: var(--shadow-1); transition: background .15s, box-shadow .15s;
}
.chip:hover { box-shadow: var(--shadow-2); }
.chip.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.chip.primary:hover { filter: brightness(1.08); }
.typing { display: inline-flex; gap: 4px; align-items: center; height: 24px; }
.working-line { display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 14px; }

.dock { flex: none; padding: 0 24px 20px; }
.dock-inner { max-width: 720px; margin: 0 auto; background: var(--surface); box-shadow: var(--shadow-2); border-radius: 22px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; }
.dock input { flex: 1; border: 0; outline: 0; background: none; font-size: 15px; height: 32px; min-width: 0; }
.dock input::placeholder { color: var(--ink-3); }
.dock-inner:focus-within { box-shadow: var(--shadow-2), 0 0 0 2px var(--accent); }

/* ───────── Fenêtres modales ───────── */
.overlay { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(6px) saturate(1.1); -webkit-backdrop-filter: blur(6px) saturate(1.1); display: grid; place-items: center; z-index: 20; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.dialog { width: 440px; max-height: calc(100% - 64px); overflow-y: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-modal); animation: pop .22s cubic-bezier(.2, .9, .3, 1.1); }
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(6px); } }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 20px 20px 16px; }
.dlg-head .mono { width: 40px; height: 40px; }
.dlg-head h2 { font-size: 17px; line-height: 22px; font-weight: 650; letter-spacing: -.015em; }
.dlg-head p { color: var(--ink-2); font-size: 13px; line-height: 18px; }
.dlg-head .x { margin-left: auto; align-self: flex-start; }
.dlg-sec { padding: 0 20px 16px; }
.dlg-sec > h3 { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 0 0 8px; }
.models { border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.model { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; cursor: pointer; position: relative; transition: background .12s; }
.model + .model { border-top: 1px solid var(--line); }
.model:hover { background: var(--line); }
.model input { position: absolute; opacity: 0; pointer-events: none; }
.model .name { font-weight: 500; }
.model .hint { color: var(--ink-3); font-size: 12px; }
.model .tick { margin-left: auto; width: 16px; height: 16px; color: var(--accent); opacity: 0; stroke-width: 2.2; }
.model:has(input:checked) .tick { opacity: 1; }
.model:has(input:checked) .name { font-weight: 600; }
.model:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
details.history { border-top: 1px solid var(--line); }
details.history summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; font-weight: 500; color: var(--ink-2); }
details.history summary::-webkit-details-marker { display: none; }
details.history summary:hover { color: var(--ink); }
details.history summary svg { width: 12px; height: 12px; stroke-width: 2; transition: transform .18s; }
details.history[open] summary svg { transform: rotate(90deg); }
details.history summary small { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.hist { list-style: none; padding: 0 20px 12px 40px; }
.hist li { display: flex; gap: 12px; padding: 6px 0; font-size: 13px; line-height: 19px; }
.hist time { color: var(--ink-3); width: 64px; flex: none; }
.hist span { color: var(--ink-2); }
.dlg-foot { display: flex; gap: 8px; align-items: center; padding: 16px 20px; border-top: 1px solid var(--line); }
.btn { height: 32px; padding: 0 14px; border-radius: 8px; font-weight: 500; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-strong); transition: background .15s, filter .15s; }
.btn:hover { background: var(--line); }
.btn.danger { color: var(--danger); margin-left: auto; background: none; box-shadow: none; }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.btn.danger.confirm { background: var(--danger); color: #fff; font-weight: 600; }
.btn.danger.confirm:hover { filter: brightness(1.08); }
.btn.solid { background: var(--accent); color: var(--accent-ink); box-shadow: none; font-weight: 600; }
.btn.solid:hover { filter: brightness(1.08); background: var(--accent); }
.dialog.small { width: 380px; }
.dialog.small .body { padding: 24px 24px 8px; }
.dialog.small h2 { font-size: 17px; font-weight: 650; letter-spacing: -.015em; margin-bottom: 4px; }
.dialog.small p { color: var(--ink-2); line-height: 20px; }
.dialog.small .dlg-foot { border: 0; justify-content: flex-end; padding-top: 20px; }
.dialog.small .btn.danger.confirm { margin-left: 0; }

/* ───────── Toast ───────── */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; background: #2b2926; color: #f3f1ed; padding: 8px 8px 8px 16px; border-radius: 12px; box-shadow: 0 12px 32px -8px rgba(0,0,0,.4); display: flex; align-items: center; gap: 16px; animation: toastIn .25s cubic-bezier(.2,.9,.3,1.1); }
.toast button { color: #7fd8cf; font-weight: 600; padding: 4px 8px; border-radius: 6px; }
.toast button:hover { background: rgba(255,255,255,.1); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } }

@media (max-width: 760px) {
  .grid { grid-template-columns: 1fr; }
  .wrap { padding: 16px; }
  .answer { padding-left: 20px; }
  .toolbar { padding: 0 12px; }
  .lights { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></symbol>
    <symbol id="i-panic" viewBox="0 0 24 24"><path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z"/><rect x="9" y="9" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18v3"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-argos" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></symbol>
  </defs>
</svg>

<div class="app">
  <header class="toolbar">
    <div class="tb-left">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <button class="tb-btn back" id="back" hidden aria-label="Retour à Mon équipe"><svg class="ico"><use href="#i-chev-l"/></svg>Mon équipe</button>
    </div>
    <div class="tb-title" id="tbTitle"><b>Argos</b></div>
    <div class="tb-right">
      <button class="tb-btn panic" id="panicBtn" title="Arrêt d’urgence" aria-label="Arrêt d’urgence"><svg class="ico"><use href="#i-panic"/></svg></button>
      <button class="tb-btn" id="gearBtn" title="Réglages" aria-label="Réglages"><svg class="ico"><use href="#i-gear"/></svg></button>
      <button class="tb-btn" id="moreBtn" hidden title="Options de l’agent" aria-label="Options de l’agent"><svg class="ico" style="fill:currentColor;stroke:none"><use href="#i-dots"/></svg></button>
    </div>
  </header>

  <div class="views">
    <!-- Accueil -->
    <main class="view" id="home">
      <div class="wrap">
        <div class="greet">
          <h1>Bonjour Alexandre</h1>
          <time>Vendredi 30 octobre</time>
        </div>

        <section class="assistant" aria-label="Assistant">
          <form class="composer" id="askForm" autocomplete="off">
            <span class="mark"><svg class="ico" style="fill:none"><use href="#i-argos"/></svg></span>
            <input id="askInput" type="text" placeholder="Demande quelque chose à ton assistant…" aria-label="Demande à ton assistant">
            <button type="button" class="round" aria-label="Dicter"><svg class="ico"><use href="#i-mic"/></svg></button>
            <button type="submit" class="round send" id="askSend" aria-label="Envoyer" disabled><svg class="ico" style="stroke-width:2"><use href="#i-up"/></svg></button>
          </form>
          <div class="answer" id="answer" aria-live="polite"></div>
        </section>

        <div class="section-head">
          <h2>Mon équipe<small id="teamCount"></small></h2>
          <button class="ghost" id="newAgent"><svg class="ico"><use href="#i-plus"/></svg>Nouvel agent</button>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    </main>

    <!-- Agent plein écran -->
    <main class="view" id="agent" hidden>
      <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
      <form class="dock" id="dockForm" autocomplete="off">
        <div class="dock-inner">
          <input id="dockInput" type="text" aria-label="Message">
          <button type="button" class="round" aria-label="Dicter"><svg class="ico"><use href="#i-mic"/></svg></button>
          <button type="submit" class="round send" id="dockSend" aria-label="Envoyer" disabled><svg class="ico" style="stroke-width:2"><use href="#i-up"/></svg></button>
        </div>
      </form>
    </main>
  </div>
</div>

<!-- Modale de l'agent -->
<div class="overlay" id="agentModal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgName">
    <div class="dlg-head">
      <span class="mono"><svg class="ico" id="dlgIcon"></svg></span>
      <div><h2 id="dlgName"></h2><p id="dlgRole"></p></div>
      <button class="tb-btn x" data-close aria-label="Fermer"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <div class="dlg-sec">
      <h3>Modèle</h3>
      <div class="models" id="models" role="radiogroup" aria-label="Modèle"></div>
    </div>
    <details class="history" id="historyBox">
      <summary><svg class="ico"><use href="#i-chev-r"/></svg>Historique des demandes<small id="histCount"></small></summary>
      <ul class="hist" id="hist"></ul>
    </details>
    <div class="dlg-foot">
      <button class="btn" id="pauseBtn">Mettre en pause</button>
      <button class="btn danger" id="stopBtn">Arrêter</button>
    </div>
  </div>
</div>

<!-- Arrêt d'urgence -->
<div class="overlay" id="panicModal" hidden>
  <div class="dialog small" role="alertdialog" aria-modal="true" aria-labelledby="panicTitle">
    <div class="body">
      <h2 id="panicTitle">Tout arrêter ?</h2>
      <p>Tous les agents s’arrêtent immédiatement, y compris ce qu’ils sont en train de faire. Tu pourras les relancer ensuite.</p>
    </div>
    <div class="dlg-foot">
      <button class="btn" data-close>Annuler</button>
      <button class="btn danger confirm" id="panicConfirm">Tout arrêter</button>
    </div>
  </div>
</div>

<div id="toastHost"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const icon = (id, extra = '') => `<svg class="ico" ${extra}><use href="#i-${id}"/></svg>`;

const MODELS = [
  { id: 'opus',   name: 'Claude Opus 5.5',   hint: 'puissant' },
  { id: 'sonnet', name: 'Claude Sonnet 5.5', hint: 'équilibré' },
  { id: 'haiku',  name: 'Claude Haiku 5.5',  hint: 'économique' },
  { id: 'sol',    name: 'GPT-6.1 Sol',       hint: '' },
  { id: 'luna',   name: 'GPT-6 Luna',        hint: '' },
];

const AGENTS = [
  {
    id: 'alex', name: 'Courrier Alexandre', role: 'Trie ta boîte perso et prépare tes réponses',
    icon: 'mail', status: 'wait', doing: '', model: 'sonnet',
    ask: 'Deux mails de la banque attendent une réponse aujourd’hui : je prépare les brouillons ?',
    history: [
      ['Aujourd’hui', 'Surveiller ma boîte perso et signaler l’urgent'],
      ['Mardi', 'Résilier l’abonnement de la salle de sport'],
      ['12 oct.', 'Classer les factures de 2026 par fournisseur'],
      ['3 oct.', 'Désinscris-moi des newsletters que je n’ouvre jamais'],
    ],
    thread: [
      { t: 'day', v: 'Hier, 18:12' },
      { t: 'user', v: 'Surveille ma boîte perso et dis-moi ce qui est urgent.' },
      { t: 'agent', v: 'C’est noté. Je regarde toutes les heures et je ne te dérange que si quelque chose ne peut pas attendre.' },
      { t: 'day', v: 'Aujourd’hui, 9:41' },
      { t: 'tools', v: ['Lecture de la boîte de réception', 'Recherche des mails de la banque', 'Lecture de 2 messages'] },
      { t: 'agent', v: ['J’ai passé 18 nouveaux mails en revue : 14 newsletters et notifications, 2 factures, et 2 mails de ta banque.', 'Le premier demande un justificatif de domicile, le second confirme une modification de plafond de carte à valider avant ce soir.'] },
      { t: 'ask' },
    ],
  },
  {
    id: 'pro', name: 'Courrier professionnel', role: 'Gère ta messagerie pro et ton agenda',
    icon: 'brief', status: 'rest', doing: '', model: 'sonnet', ask: '',
    history: [
      ['Jeudi', 'Résumer les mails de la semaine sur le projet Atlas'],
      ['Lundi', 'Décaler la réunion du mardi à jeudi 14 h'],
      ['16 oct.', 'Préparer un point d’étape pour Claire'],
    ],
    thread: [
      { t: 'day', v: 'Jeudi, 17:30' },
      { t: 'user', v: 'Résume-moi les mails de la semaine sur le projet Atlas.' },
      { t: 'tools', v: ['Recherche « Atlas » dans la messagerie pro', 'Lecture de 23 messages', 'Regroupement par sujet'] },
      { t: 'agent', v: ['Voici l’essentiel de la semaine sur Atlas :', 'La livraison de la maquette est confirmée pour le 6 novembre. Le client demande un second échange sur le budget. Claire attend ta validation du planning, rien d’urgent.'] },
      { t: 'user', v: 'Parfait, merci.' },
      { t: 'agent', v: 'Avec plaisir. Je reste attentif à la boîte et je te préviens si le client relance.' },
    ],
  },
  {
    id: 'mac', name: 'Entretien Mac', role: 'Garde ton Mac propre et rapide',
    icon: 'laptop', status: 'work', doing: 'nettoie les caches de Xcode…', model: 'haiku', ask: '',
    history: [
      ['Aujourd’hui', 'Faire de la place sur le disque'],
      ['Lundi', 'Vérifier les mises à jour en attente'],
      ['5 oct.', 'Vider les téléchargements de plus de 3 mois'],
    ],
    thread: [
      { t: 'day', v: 'Aujourd’hui, 10:02' },
      { t: 'user', v: 'Fais de la place sur le disque, il est presque plein.' },
      { t: 'agent', v: 'Je m’en occupe. Je commence par les caches de Xcode, puis les anciennes sauvegardes d’iPhone. Je ne touche à aucun de tes documents.' },
      { t: 'tools', v: ['Analyse de l’espace disque', 'Repérage des caches volumineux', 'Suppression de 6,2 Go de fichiers temporaires', 'Vérification de la corbeille', 'Nettoyage des caches de Xcode'] },
      { t: 'agent', v: 'J’ai déjà libéré 6,2 Go. Il en reste environ 14 Go à récupérer côté Xcode.' },
      { t: 'working', v: 'Nettoyage des caches de Xcode…' },
    ],
  },
  {
    id: 'home', name: 'Maison', role: 'Pilote les lumières et le chauffage',
    icon: 'house', status: 'rest', doing: '', model: 'haiku', ask: '',
    history: [
      ['Mercredi', 'Baisser le chauffage à 19 °C quand je pars'],
      ['Dimanche', 'Éteindre les lumières du salon à 23 h'],
    ],
    thread: [
      { t: 'day', v: 'Mercredi, 8:15' },
      { t: 'user', v: 'Baisse le chauffage à 19 °C quand je pars le matin.' },
      { t: 'tools', v: ['Lecture du thermostat', 'Création d’un horaire'] },
      { t: 'agent', v: ['C’est fait : 19 °C du lundi au vendredi, de 8 h à 17 h. Le chauffage remonte à 21 °C une heure avant ton retour.', 'Les lumières du salon s’éteignent toujours à 23 h.'] },
    ],
  },
];

const byId = id => AGENTS.find(a => a.id === id);
let currentId = null;
let lastFocus = null;

/* ───── Accueil ───── */
function statusText(a) {
  return ({
    work: 'En ce moment : ' + a.doing,
    wait: 'Attend ta réponse',
    rest: 'Au repos',
    paused: 'En pause',
    stopped: 'Arrêté',
  })[a.status];
}
function renderGrid() {
  $('#grid').innerHTML = AGENTS.map(a => `
    <article class="card">
      <div class="card-head">
        <span class="mono">${icon(a.icon)}</span>
        <div class="card-id">
          <h3><button class="card-open" data-open="${a.id}">${a.name}</button></h3>
          <p class="role">${a.role}</p>
        </div>
      </div>
      <p class="status s-${a.status}"><span class="dot"></span><span>${statusText(a)}</span></p>
      ${a.ask ? `<div class="ask"><div class="ask-top"><b>A besoin de toi</b><button class="reply" data-reply="${a.id}">Répondre</button></div><p>${a.ask}</p></div>` : ''}
    </article>`).join('');
  $('#teamCount').textContent = AGENTS.length + ' agents';
}
function renderAnswer(html, meta = 'Assistant · il y a 4 min') {
  $('#answer').innerHTML = `<div class="answer-meta">${meta}</div>${html}`;
}
function defaultAnswer() {
  const waiting = byId('alex').ask;
  renderAnswer(`
    <p>${waiting
      ? `Une seule chose demande ta décision ce matin : <button class="mention" data-open="alex">Courrier Alexandre</button> a deux mails de la banque à traiter avant ce soir.`
      : `Rien ne demande ta décision pour l’instant.`}
    <button class="mention" data-open="mac">Entretien Mac</button> nettoie le disque et a déjà libéré 6 Go. <button class="mention" data-open="home">Maison</button> a baissé le chauffage à 19 °C pour la journée et ta messagerie pro est à jour.</p>`);
}

/* ───── Vue agent ───── */
function agentMsgHtml(m) {
  switch (m.t) {
    case 'day': return `<div class="day">${m.v}</div>`;
    case 'user': return `<div class="msg-user">${m.v}</div>`;
    case 'agent': return `<div class="msg-agent">${[].concat(m.v).map(p => `<p>${p}</p>`).join('')}</div>`;
    case 'tools': return `<div class="tools"><button class="tools-toggle" aria-expanded="false">${m.v.length} actions ${icon('chev-r')}</button><ul hidden>${m.v.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
    case 'working': return `<div class="working-line"><span class="typing"><i></i><i></i><i></i></span>${m.v}</div>`;
    default: return '';
  }
}
function renderThread(a) {
  let html = a.thread.map(agentMsgHtml).join('');
  if (a.ask) {
    html += `<div class="msg-agent" id="askMsg"><p><b>${a.ask}</b></p>
      <div class="chips"><button class="chip primary" data-answer="yes">Oui, prépare-les</button><button class="chip" data-answer="no">Pas maintenant</button></div></div>`;
  }
  $('#thread').innerHTML = html;
}
function scrollEnd() { const s = $('#scroll'); s.scrollTop = s.scrollHeight; }

function openAgent(id, focusReply = false) {
  currentId = id;
  const a = byId(id);
  renderThread(a);
  $('#tbTitle').innerHTML = `<b>${a.name}</b><span>${a.role}</span>`;
  $('#dockInput').placeholder = `Écris à ${a.name}…`;
  $('#home').hidden = true;
  const v = $('#agent'); v.hidden = false; v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  $('#back').hidden = false; $('#moreBtn').hidden = false; $('#gearBtn').hidden = true;
  scrollEnd();
  if (focusReply) $('#dockInput').focus();
}
function goHome() {
  currentId = null;
  $('#agent').hidden = true;
  const v = $('#home'); v.hidden = false; v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  $('#tbTitle').innerHTML = '<b>Argos</b>';
  $('#back').hidden = true; $('#moreBtn').hidden = true; $('#gearBtn').hidden = false;
  renderGrid();
}

/* ───── Modales ───── */
function openModal(el) {
  lastFocus = document.activeElement;
  el.hidden = false;
  const f = el.querySelector('input:checked, button:not([data-close])') || el.querySelector('button');
  f && f.focus();
}
function closeModals() {
  document.querySelectorAll('.overlay').forEach(o => o.hidden = true);
  $('#stopBtn').classList.remove('confirm'); $('#stopBtn').textContent = 'Arrêter';
  lastFocus && lastFocus.focus && lastFocus.focus();
}
function openAgentMenu() {
  const a = byId(currentId);
  $('#dlgIcon').innerHTML = `<use href="#i-${a.icon}"/>`;
  $('#dlgName').textContent = a.name;
  $('#dlgRole').textContent = a.role;
  $('#models').innerHTML = MODELS.map(m => `
    <label class="model"><input type="radio" name="model" value="${m.id}" ${a.model === m.id ? 'checked' : ''}>
      <span class="name">${m.name}</span>${m.hint ? `<span class="hint">${m.hint}</span>` : ''}
      <svg class="ico tick"><use href="#i-check"/></svg></label>`).join('');
  $('#hist').innerHTML = a.history.map(h => `<li><time>${h[0]}</time><span>${h[1]}</span></li>`).join('');
  $('#histCount').textContent = a.history.length + ' demandes';
  $('#historyBox').open = false;
  $('#pauseBtn').textContent = a.status === 'paused' ? 'Reprendre' : 'Mettre en pause';
  openModal($('#agentModal'));
}

/* ───── Toast ───── */
let toastTimer;
function toast(msg, actionLabel, action) {
  const host = $('#toastHost'); clearTimeout(toastTimer);
  host.innerHTML = `<div class="toast" role="status"><span>${msg}</span>${actionLabel ? `<button>${actionLabel}</button>` : ''}</div>`;
  if (actionLabel) host.querySelector('button').onclick = () => { action(); host.innerHTML = ''; };
  toastTimer = setTimeout(() => host.innerHTML = '', 5000);
}

/* ───── Événements ───── */
document.addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open) return openAgent(open.dataset.open);
  const reply = e.target.closest('[data-reply]');
  if (reply) return openAgent(reply.dataset.reply, true);
  const tg = e.target.closest('.tools-toggle');
  if (tg) {
    const ul = tg.nextElementSibling, ex = tg.getAttribute('aria-expanded') === 'true';
    tg.setAttribute('aria-expanded', String(!ex)); ul.hidden = ex; return;
  }
  const ans = e.target.closest('[data-answer]');
  if (ans) return answerAsk(ans.dataset.answer);
  if (e.target.closest('[data-close]') || e.target.classList.contains('overlay')) closeModals();
});

function pushMsgs(list, delay = 0) {
  const t = $('#thread');
  list.forEach((m, i) => setTimeout(() => {
    if (currentId === null) return;
    t.insertAdjacentHTML('beforeend', agentMsgHtml(m)); scrollEnd();
  }, delay * (i + 1)));
}
function answerAsk(kind) {
  const a = byId(currentId);
  $('#askMsg')?.querySelector('.chips')?.remove();
  const text = kind === 'yes' ? 'Oui, prépare-les' : 'Pas maintenant';
  a.thread.push({ t: 'agent', v: a.ask });
  a.ask = '';
  a.thread.push({ t: 'user', v: text });
  $('#askMsg').removeAttribute('id');
  pushMsgs([{ t: 'user', v: text }], 0);
  if (kind === 'yes') {
    a.status = 'work'; a.doing = 'rédige deux brouillons pour la banque…';
    const r = { t: 'agent', v: 'Je m’en occupe. Je te montre les deux brouillons avant tout envoi.' };
    a.thread.push(r); pushMsgs([r], 700);
  } else {
    a.status = 'rest';
    const r = { t: 'agent', v: 'D’accord, je ne touche à rien. Je te redemande en fin d’après-midi.' };
    a.thread.push(r); pushMsgs([r], 700);
  }
  defaultAnswer();
}
function sendToAgent(text) {
  const a = byId(currentId);
  const u = { t: 'user', v: text }, r = { t: 'agent', v: 'Bien reçu, je m’en occupe.' };
  a.thread.push(u, r); a.history.unshift(['Aujourd’hui', text]);
  pushMsgs([u], 0); pushMsgs([r], 800);
}

$('#back').onclick = goHome;
$('#moreBtn').onclick = openAgentMenu;
$('#gearBtn').onclick = () => toast('Les réglages s’ouvrent ici. Ils sont rarement utiles, donc cachés.');
$('#newAgent').onclick = () => toast('Dis simplement à ton assistant quel rôle il manque à l’équipe.');
$('#panicBtn').onclick = () => openModal($('#panicModal'));

$('#askInput').oninput = e => $('#askSend').disabled = !e.target.value.trim();
$('#dockInput').oninput = e => $('#dockSend').disabled = !e.target.value.trim();
$('#askForm').onsubmit = e => {
  e.preventDefault();
  const v = $('#askInput').value.trim(); if (!v) return;
  $('#askInput').value = ''; $('#askSend').disabled = true;
  renderAnswer('<span class="thinking"><i></i><i></i><i></i></span>', 'Assistant · à l’instant');
  setTimeout(() => renderAnswer(`<p>C’est noté. Je transmets ta demande à l’agent le plus adapté et je te dis dès que c’est fait.</p>`, 'Assistant · à l’instant'), 1100);
};
$('#dockForm').onsubmit = e => {
  e.preventDefault();
  const v = $('#dockInput').value.trim(); if (!v) return;
  $('#dockInput').value = ''; $('#dockSend').disabled = true;
  sendToAgent(v);
};

/* Modale agent */
$('#models').addEventListener('change', e => { byId(currentId).model = e.target.value; });
$('#pauseBtn').onclick = () => {
  const a = byId(currentId);
  if (a.status === 'paused') { a.status = a.prev || 'rest'; toast(`${a.name} a repris.`); }
  else { a.prev = a.status; a.status = 'paused'; toast(`${a.name} est en pause.`); }
  closeModals();
};
$('#stopBtn').onclick = e => {
  const b = e.currentTarget;
  if (!b.classList.contains('confirm')) { b.classList.add('confirm'); b.textContent = 'Confirmer l’arrêt'; return; }
  const a = byId(currentId); a.prev = a.status === 'paused' ? 'rest' : a.status; a.status = 'stopped'; a.ask = '';
  closeModals(); goHome(); defaultAnswer();
  toast(`${a.name} est arrêté.`, 'Relancer', () => { a.status = a.prev || 'rest'; renderGrid(); });
};

/* Arrêt d'urgence */
$('#panicConfirm').onclick = () => {
  const snap = AGENTS.map(a => [a, a.status, a.ask]);
  AGENTS.forEach(a => { a.status = 'stopped'; a.ask = ''; });
  closeModals(); if (currentId) goHome(); else renderGrid();
  toast('Tous les agents sont arrêtés.', 'Annuler', () => { snap.forEach(([a, s, k]) => { a.status = s; a.ask = k; }); renderGrid(); defaultAnswer(); });
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#agentModal').hidden || !$('#panicModal').hidden) closeModals();
    else if (currentId) goHome();
  }
});

renderGrid();
defaultAnswer();
</script>
</body>
</html>
