[package]
name = "argos-gui"
description = "GUI Argos (Tauri) : orbe, console, surfaces"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire (https://github.com/rust-lang/cargo/issues/8519).
name = "argos_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argos-core.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
