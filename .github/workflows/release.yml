name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches application versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit(f'Tag de version invalide : {tag}')
          with open('Cargo.toml', 'rb') as f: cargo = tomllib.load(f)['workspace']['package']['version']
          with open('apps/gui/package.json') as f: npm = json.load(f)['version']
          with open('apps/gui/src-tauri/tauri.conf.json') as f: tauri = json.load(f)['version']
          if any(version != tag[1:] for version in (cargo, npm, tauri)):
              raise SystemExit(f'Versions incohérentes : tag {tag}, Cargo {cargo}, npm {npm}, Tauri {tauri}')
          PY
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft >/tmp/argos-release-state 2>/dev/null; then
            test "$(cat /tmp/argos-release-state)" = true || { echo 'Cette version est déjà publiée.'; exit 1; }
          else
            printf '%s\n' 'Archives non signées pour macOS (Apple Silicon et Intel), Windows x64 et Linux x86_64. Windows : extraire entièrement le ZIP puis lancer Argos.cmd ; la voix locale est incluse. macOS : lancer Lancer-Argos.command. Linux : extraire l’archive puis lancer Argos/lancer-argos.sh. Sur macOS et Linux, la voix nécessite une installation séparée. Codex ou Claude doit être installé et authentifié séparément. Windows et Linux n’ont pas encore été validés sur une machine réelle. Voir le README pour l’installation détaillée.' > /tmp/argos-release-notes.txt
            gh release create "$GITHUB_REF_NAME" --draft --title "Argos $GITHUB_REF_NAME" --notes-file /tmp/argos-release-notes.txt --verify-tag
          fi
  macos:
    permissions:
      contents: write
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/package-macos.sh
      - name: Upload macOS archives to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd target/distribution/macos-${{ matrix.arch }}
          shasum -a 256 -c SHA256SUMS-macos-${{ matrix.arch }}.txt
          gh release upload "$GITHUB_REF_NAME" Argos-macOS-${{ matrix.arch }}.zip SHA256SUMS-macos-${{ matrix.arch }}.txt --clobber
  windows:
    permissions:
      contents: write
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Windows process isolation
        run: cargo test --locked -p argos-core --lib
      - shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload Windows archive to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release upload "$env:GITHUB_REF_NAME" target/distribution/windows-x64/Argos-Windows-x64.zip target/distribution/windows-x64/SHA256SUMS-windows.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Téléversement des fichiers Windows échoué.' }
  linux:
    permissions:
      contents: write
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libfuse2 file
      - run: ./scripts/package-linux.sh
      - name: Upload Linux archive to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd target/distribution/linux-x86_64
          sha256sum -c SHA256SUMS-linux-x86_64.txt
          gh release upload "$GITHUB_REF_NAME" Argos-Linux-x86_64.tar.gz SHA256SUMS-linux-x86_64.txt --clobber
  linux-arm64:
    # Un nœud sans écran (Raspberry Pi, D48) : le daemon seul.
    permissions:
      contents: write
    needs: version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p argos-daemon
      - name: Package the node archive
        run: |
          set -euo pipefail
          out=target/distribution/linux-arm64
          mkdir -p "$out/Argos"
          cp target/release/argos-daemon "$out/Argos/"
          printf '%s\n' "Argos, nœud Linux arm64 (daemon seul). Installer : install.sh --node <nom>." > "$out/Argos/LISEZ-MOI.txt"
          tar -C "$out" -czf "$out/Argos-Node-Linux-arm64.tar.gz" Argos
          (cd "$out" && sha256sum Argos-Node-Linux-arm64.tar.gz > SHA256SUMS-linux-arm64.txt)
      - name: Upload node archive to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd target/distribution/linux-arm64
          sha256sum -c SHA256SUMS-linux-arm64.txt
          gh release upload "$GITHUB_REF_NAME" Argos-Node-Linux-arm64.tar.gz SHA256SUMS-linux-arm64.txt --clobber
  release:
    needs: [macos, windows, linux, linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets > /tmp/argos-release.json
          python3 - <<'PY'
          import json
          with open('/tmp/argos-release.json') as f: release = json.load(f)
          expected = {'Argos-macOS-arm64.zip', 'Argos-macOS-x86_64.zip', 'Argos-Windows-x64.zip', 'Argos-Linux-x86_64.tar.gz', 'SHA256SUMS-macos-arm64.txt', 'SHA256SUMS-macos-x86_64.txt', 'SHA256SUMS-windows.txt', 'SHA256SUMS-linux-x86_64.txt', 'Argos-Node-Linux-arm64.tar.gz', 'SHA256SUMS-linux-arm64.txt'}
          uploaded = {a['name'] for a in release['assets'] if a['state'] == 'uploaded' and a['size'] > 0}
          if not release['isDraft'] or expected - uploaded:
              raise SystemExit(f'Brouillon incomplet : {expected - uploaded}')
          PY
          flags=()
          if [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release edit "$GITHUB_REF_NAME" --draft=false "${flags[@]}"
