<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Argos — design actuel allégé</title><style>/* Console Argos : compacte et sobre, lisible en clair comme en sombre.
   Les couleurs passent par des rôles (surface, texte, accent…) définis ici. */

:root {
  --bg: #f6f6f4;
  --surface: #ffffff;
  --surface-2: #f0f0ed;
  --border: #e2e2de;
  --border-strong: #cfcfca;
  --text: #1c1c1a;
  --text-muted: #6d6d68;
  --accent: #3d54c9;
  --accent-soft: #e8ebfa;
  --accent-text: #ffffff;
  --ok: #2e8f47;
  --warn: #b86e00;
  --warn-soft: #fbf1e0;
  --danger: #c8322a;
  --danger-soft: #fbe9e7;
  /* Fond des boutons destructifs : assez sombre pour un texte blanc dans les deux thèmes. */
  --danger-fill: #c8322a;
  --focus: #3d54c9;

  --radius: 6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;

  color-scheme: light dark;
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618;
    --surface: #1d1d20;
    --surface-2: #26262a;
    --border: #2f2f34;
    --border-strong: #3d3d43;
    --text: #e9e9ec;
    --text-muted: #9a9aa3;
    --accent: #8396ff;
    --accent-soft: #262c4d;
    --accent-text: #11131f;
    --ok: #57c274;
    --warn: #e7a33e;
    --warn-soft: #33281a;
    --danger: #ff6b61;
    --danger-soft: #3a1f1d;
    --danger-fill: #c43a30;
    --focus: #8396ff;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
}

h1,
h2,
p {
  margin: 0;
}

button,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.muted {
  color: var(--text-muted);
}

.mono {
  font-family: var(--mono);
  font-size: 0.92em;
}

/* --- Structure ------------------------------------------------------------------ */

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.brand {
  font-weight: 650;
  letter-spacing: 0.02em;
}

.spacer {
  flex: 1;
}

.body {
  display: flex;
  flex: 1;
  min-height: 0;
}

.sidebar {
  width: 280px;
  flex-shrink: 0;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  background: var(--surface);
}

.sidebar-head {
  display: flex;
  justify-content: space-between;
  padding: 10px 14px 6px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}

.sidebar-empty {
  padding: 8px 14px;
}

.main {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  min-height: 0;
}

/* Fenêtre étroite : l'arbre passe au-dessus du chat. */
@media (max-width: 640px) {
  .body {
    flex-direction: column;
  }
  .sidebar {
    width: auto;
    max-height: 35vh;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
}

/* --- Boutons -------------------------------------------------------------------- */

.button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  white-space: nowrap;
}

.button:hover:not(:disabled) {
  background: var(--surface-2);
}

.button:disabled {
  opacity: 0.45;
  cursor: default;
}

.button-primary {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-text);
}

.button-primary:hover:not(:disabled) {
  background: var(--accent);
  filter: brightness(1.08);
}

.button-danger {
  border-color: var(--danger-fill);
  background: var(--danger-fill);
  color: #fff;
}

.button-danger:hover:not(:disabled) {
  background: var(--danger-fill);
  filter: brightness(1.08);
}

.button-danger-quiet {
  color: var(--danger);
}

.panic {
  border-color: var(--danger-fill);
  background: var(--danger-fill);
  color: #fff;
  font-weight: 600;
}

.panic:hover:not(:disabled) {
  background: var(--danger-fill);
  filter: brightness(1.1);
}

.panic kbd {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 500;
  opacity: 0.8;
}

.link {
  padding: 0;
  border: none;
  background: none;
  color: var(--accent);
  cursor: pointer;
  text-decoration: underline;
}

/* --- Connexion ------------------------------------------------------------------ */

.connection {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  font-size: 12px;
}

.connection-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
}

.connection[data-status="connected"] .connection-dot {
  background: var(--ok);
}

.connection[data-status="reconnecting"] .connection-dot,
.connection[data-status="connecting"] .connection-dot {
  background: var(--warn);
  animation: pulse 1.2s ease-in-out infinite;
}

.connection[data-status="unauthorized"] .connection-dot,
.connection[data-status="unconfigured"] .connection-dot {
  background: var(--danger);
}

.connection[data-status="unauthorized"] .connection-label {
  color: var(--danger);
  font-weight: 600;
}

.connection-label {
  font-weight: 550;
}

.connection-detail {
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* --- Arbre ---------------------------------------------------------------------- */

.tree,
.tree ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

.tree {
  padding-bottom: 8px;
}

.tree-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 5px 10px;
  border: none;
  border-left: 2px solid transparent;
  background: none;
  text-align: left;
  cursor: pointer;
}

.tree-row:hover {
  background: var(--surface-2);
}

.tree-row[data-selected] {
  border-left-color: var(--accent);
  background: var(--accent-soft);
}

.tree-text {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}

.tree-name {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-weight: 550;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.tree-row[data-level="worker"] .tree-name {
  font-family: var(--mono);
  font-weight: 450;
  font-size: 12px;
}

.tree-id {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 400;
  color: var(--text-muted);
}

.tree-meta {
  font-size: 11.5px;
  color: var(--text-muted);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.flags {
  display: inline-flex;
  gap: 4px;
  flex-shrink: 0;
}

.flag {
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 10.5px;
  line-height: 16px;
  color: var(--text-muted);
}

.flag[data-state="active"] {
  border-color: color-mix(in srgb, var(--ok) 45%, transparent);
  color: var(--ok);
}

.flag-busy {
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
  color: var(--accent);
}

/* Pastille d'exécution. */
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1.5px solid var(--text-muted);
}

.dot[data-status="running"] {
  border-color: var(--ok);
  background: var(--ok);
}

.dot[data-status="busy"] {
  border-color: var(--accent);
  background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
  50% {
    opacity: 0.35;
  }
}

@media (prefers-reduced-motion: reduce) {
  .dot,
  .connection-dot {
    animation: none !important;
  }
}

/* --- Chat ----------------------------------------------------------------------- */

.chat {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.chat-header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.chat-title {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.chat-title h1 {
  font-size: 15px;
  font-weight: 650;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.level-tag {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.chat-meta {
  grid-column: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-size: 12px;
  color: var(--text-muted);
}

.chat-actions {
  grid-column: 2;
  grid-row: 1 / span 2;
  display: flex;
  align-items: center;
  gap: 6px;
}

@media (max-width: 640px) {
  .chat-header {
    grid-template-columns: 1fr;
  }
  .chat-actions {
    grid-column: 1;
    grid-row: auto;
    margin-top: 6px;
  }
}

.readonly-banner {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: 12px;
}

.thread {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px 16px;
}

.thread-empty {
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 4px;
}

.entry {
  max-width: min(720px, 85%);
}

.bubble {
  padding: 7px 10px;
  border-radius: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.entry-agent .bubble {
  border: 1px solid var(--border);
  background: var(--surface);
}

/* Ce que l'agent reçoit, à droite. Message de l'utilisateur : bulle pleine. Message
   préfixé par un outil (mission, rapport…) : cadre avec étiquette, filet de couleur. */
.entry-input {
  align-self: flex-end;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.entry-input .bubble {
  background: var(--accent-soft);
}

.entry-input[data-tagged] .bubble {
  border: 1px solid var(--border);
  border-left: 3px solid var(--border-strong);
  background: var(--surface);
}

.entry-input[data-category="free"] .bubble {
  background: var(--surface-2);
}

.entry-input[data-category="mission"] .bubble,
.entry-input[data-category="task"] .bubble,
.entry-input[data-category="question"] .bubble,
.entry-input[data-category="information"] .bubble,
.entry-input[data-category="surface"] .bubble,
.entry-input[data-category="trigger"] .bubble {
  border-left-color: var(--accent);
}

.entry-input[data-category="report"] .bubble {
  border-left-color: var(--ok);
}

.entry-input[data-category="escalation"] .bubble {
  border-left-color: var(--warn);
  background: var(--warn-soft);
}

.entry-input[data-category="argos"] .bubble {
  color: var(--text-muted);
}

.input-tag {
  margin-bottom: 2px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
}

.entry-input[data-delivery="failed"] .bubble,
.entry-input[data-delivery="lost"] .bubble {
  outline: 1px dashed var(--danger);
}

.entry-note {
  margin-top: 2px;
  font-size: 11px;
  color: var(--text-muted);
}

.entry-input[data-delivery="failed"] .entry-note,
.entry-input[data-delivery="lost"] .entry-note {
  color: var(--danger);
}

.entry-tool {
  font-size: 12px;
  padding-left: 10px;
}

.entry-turn {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  max-width: none;
  padding: 2px 10px;
  border-left: 2px solid var(--border-strong);
  font-size: 11.5px;
  color: var(--text-muted);
}

.entry-turn[data-outcome="interrupted"] {
  border-left-color: var(--warn);
  color: var(--warn);
}

.entry-turn[data-outcome="failed"] {
  border-left-color: var(--danger);
  color: var(--danger);
}

.composer {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  padding: 10px 16px 14px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.composer textarea {
  flex: 1;
  min-height: 52px;
  max-height: 200px;
  padding: 7px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--bg);
  resize: vertical;
}

.composer textarea:disabled {
  opacity: 0.6;
}

.composer-actions {
  display: flex;
  gap: 6px;
}

/* --- Avis et dialogues ---------------------------------------------------------- */

.notices {
  display: flex;
  flex-direction: column;
  gap: 1px;
  border-bottom: 1px solid var(--border);
}

.notice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 16px;
  background: var(--danger-soft);
  color: var(--danger);
}

.notice[data-tone="warning"] {
  background: var(--warn-soft);
  color: var(--warn);
}

.notice[data-tone="info"] {
  background: var(--accent-soft);
  color: var(--text);
}

.notice span {
  flex: 1;
  overflow-wrap: anywhere;
}

.notice-close {
  border: none;
  background: none;
  color: inherit;
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
}

.placeholder {
  display: flex;
  flex-direction: column;
  gap: 8px;
  justify-content: center;
  align-items: center;
  flex: 1;
  padding: 24px;
  text-align: center;
}

.placeholder h1 {
  font-size: 15px;
}

.dialog {
  width: min(420px, calc(100vw - 32px));
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 12px 40px rgb(0 0 0 / 0.25);
}

.dialog::backdrop {
  background: rgb(0 0 0 / 0.3);
}

.dialog h2 {
  font-size: 15px;
  margin-bottom: 8px;
}

.dialog-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}

/* --- Nœuds ---------------------------------------------------------------------- */

.nodes {
  display: inline-flex;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
}

.node {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: default;
}

.node-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--danger);
}

.node[data-connected="true"] .node-dot {
  background: var(--ok);
}

/* --- Voix ----------------------------------------------------------------------- */

.voice-badge {
  padding: 0 7px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 11px;
  line-height: 18px;
  color: var(--text-muted);
}

.voice-badge[data-status="ready"] {
  border-color: color-mix(in srgb, var(--ok) 45%, transparent);
  color: var(--ok);
}

.voice-badge[data-status="failed"] {
  border-color: color-mix(in srgb, var(--warn) 50%, transparent);
  color: var(--warn);
}

.voice-badge[data-status="disabled"],
.voice-badge[data-status="failed"] {
  cursor: help;
}

.voice-trial {
  display: flex;
  gap: 6px;
}

.voice-trial input {
  width: 220px;
  height: 28px;
  padding: 0 8px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  background: var(--bg);
  font: inherit;
  font-size: 12px;
  color: inherit;
}

.entry-dictation .bubble {
  border: 1px dashed var(--accent);
  background: transparent;
  font-style: italic;
  color: var(--text-muted);
}

/* --- Texte en streaming --------------------------------------------------------- */

.caret {
  display: inline-block;
  width: 7px;
  height: 1em;
  margin-left: 2px;
  vertical-align: text-bottom;
  background: var(--accent);
  animation: blink 1s steps(2, start) infinite;
}

@keyframes blink {
  to {
    visibility: hidden;
  }
}

@media (prefers-reduced-motion: reduce) {
  .caret {
    animation: none;
  }
}

/* --- Déclencheurs --------------------------------------------------------------- */

.triggers {
  flex-shrink: 0;
  max-height: 40%;
  overflow-y: auto;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.triggers summary {
  padding: 7px 16px;
  cursor: pointer;
  font-size: 12px;
}

.trigger-list {
  list-style: none;
  margin: 0;
  padding: 0 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.trigger {
  padding: 6px 0 6px 10px;
  border-left: 2px solid var(--accent);
}

.trigger[data-enabled="false"] {
  border-left-color: var(--border-strong);
  opacity: 0.75;
}

.trigger-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
}

.trigger-head .button {
  height: 24px;
  padding: 0 8px;
  font-size: 12px;
}

.trigger-name {
  font-weight: 600;
}

.trigger-kind {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.trigger-detail {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-top: 3px;
  font-size: 12px;
}

.trigger-url {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 8px;
  min-width: 0;
  overflow-wrap: anywhere;
}

.trigger-prompt {
  margin-top: 3px;
  font-size: 12px;
  color: var(--text-muted);
  white-space: pre-wrap;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* --- Onglets et surfaces -------------------------------------------------------- */

.tabs {
  display: flex;
  gap: 2px;
  padding: 0 12px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px 6px;
  border: none;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
}

.tab:hover {
  color: var(--text);
}

.tab[aria-selected="true"] {
  border-bottom-color: var(--accent);
  color: var(--text);
  font-weight: 550;
}

.tab-title {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.surface-kind {
  padding: 0 5px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 10px;
  font-weight: 500;
  line-height: 15px;
  color: var(--text-muted);
}

.surface-kind[data-kind="cockpit"] {
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
  color: var(--accent);
}

.surface {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.surface-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.surface-title {
  font-weight: 600;
}

.surface-frame {
  flex: 1;
  width: 100%;
  border: none;
  /* La page de l'agent choisit son fond ; blanc par défaut, comme un navigateur. */
  background: #fff;
}

.surface-loading {
  padding: 16px;
}

/* --- Escalades ------------------------------------------------------------------ */

.escalations {
  display: flex;
  flex-direction: column;
  gap: 1px;
  border-bottom: 1px solid var(--border);
}

.escalation {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-left: 3px solid var(--warn);
  background: var(--warn-soft);
}

.escalation-text {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}

.escalation-text strong {
  color: var(--warn);
}

.escalation-body {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--text-muted);
}

.alert-badge {
  min-width: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--warn);
  color: var(--surface);
  font-family: var(--font);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
}

/* --- Board ---------------------------------------------------------------------- */

.board {
  flex-shrink: 0;
  max-height: 40%;
  overflow-y: auto;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.board summary {
  padding: 7px 16px;
  cursor: pointer;
  font-size: 12px;
}

.board-title {
  margin-right: 10px;
  font-weight: 600;
}

.board-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 16px 10px;
}

.board-mission header {
  display: flex;
  gap: 8px;
  align-items: baseline;
  margin-bottom: 4px;
}

.board-mission-text {
  font-weight: 550;
  white-space: pre-wrap;
}

.board-tasks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.board-task {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 3px 0 3px 8px;
  border-left: 1px solid var(--border);
}

.board-task-text {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}

.board-task-result {
  font-size: 12px;
  white-space: pre-wrap;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.board-task-worker {
  flex-shrink: 0;
  font-size: 11px;
}

.board-empty {
  padding-left: 8px;
  font-size: 12px;
}

.task-state {
  flex-shrink: 0;
  min-width: 76px;
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.task-state[data-state="in_progress"] {
  color: var(--accent);
}

.task-state[data-state="done"] {
  color: var(--ok);
}

.task-state[data-state="blocked"],
.task-state[data-state="interrupted"] {
  color: var(--warn);
}

.task-state[data-state="cancelled"] {
  text-decoration: line-through;
}

/* Réglage des raccourcis */
.shortcuts {
  list-style: none;
  margin: 0 0 0.75rem;
  padding: 0;
  display: grid;
  gap: 0.5rem;
}

.shortcut-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 0.75rem;
}

.shortcut-row kbd {
  min-width: 6rem;
  text-align: center;
}

.shortcut-capture {
  animation: shortcut-blink 1s ease-in-out infinite;
}

@keyframes shortcut-blink {
  50% {
    opacity: 0.45;
  }
}

.shortcut-error {
  color: var(--danger, #d64545);
  margin: 0.25rem 0;
}

/* Choix du modèle d'un agent */
.model-picker {
  position: relative;
  display: inline-block;
}

.model-picker-button {
  font: inherit;
  font-size: 0.85em;
  color: inherit;
  background: transparent;
  border: 1px solid var(--border-strong, rgba(127, 127, 127, 0.45));
  border-radius: 6px;
  padding: 0.1rem 0.45rem;
  cursor: pointer;
}

.model-picker-button:hover:not(:disabled) {
  background: var(--border, rgba(127, 127, 127, 0.15));
}

.model-picker-menu {
  position: absolute;
  z-index: 50;
  top: calc(100% + 4px);
  left: 0;
  min-width: 18rem;
  max-width: 26rem;
  max-height: 60vh;
  overflow-y: auto;
  padding: 0.35rem;
  background: var(--surface, #fff);
  border: 1px solid var(--border-strong, rgba(127, 127, 127, 0.45));
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

.model-picker-group + .model-picker-group {
  margin-top: 0.35rem;
  padding-top: 0.35rem;
  border-top: 1px solid var(--border, rgba(127, 127, 127, 0.25));
}

.model-picker-profile {
  font-size: 0.8em;
  padding: 0.15rem 0.4rem;
}

.model-picker-option {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: 0.9em;
  color: inherit;
  background: transparent;
  border: 0;
  border-radius: 5px;
  padding: 0.3rem 0.5rem;
  cursor: pointer;
}

.model-picker-option:hover,
.model-picker-option[aria-selected="true"] {
  background: var(--border, rgba(127, 127, 127, 0.15));
}

.model-picker-empty {
  padding: 0.3rem 0.5rem;
  margin: 0;
}
.workspace-picker {
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 12px;
}

.workspace-form {
  display: grid;
  gap: 8px;
  margin-top: 10px;
  max-width: 640px;
}

.workspace-form input {
  width: 100%;
  min-width: 0;
}

.workspace-form p {
  margin: 0;
}

.workspace-actions {
  display: flex;
  gap: 8px;
}

rt alt" style="margin-top:15px"><strong>Make room.<br>For more.</strong><i></i></div>');if(b?.id==='dock')panel('Le petit bonhomme','<p class="panel-copy">Aperçu de l’icône animée du Dock.</p><div class="dock-preview"><span class="dock-item"></span><span class="orb" id="dock-mascot"></span><span class="dock-item"></span></div><div class="dock-actions"><button data-mood="idle">Au repos</button><button data-mood="busy">Au travail</button><button data-mood="done">Terminé</button></div>');if(b?.dataset.mood){let o=document.querySelector('#dock-mascot');o.classList.toggle('busy',b.dataset.mood==='busy');o.style.background=b.dataset.mood==='done'?'#b1c89a':'';if(b.dataset.mood==='done')o.animate([{transform:'scale(1)'},{transform:'translateY(-12px) rotate(-10deg)'},{transform:'scale(1)'}],{duration:550})}if(!e.target.closest('#more')&&!e.target.closest('#menu'))document.querySelector('#menu')?.remove()});document.querySelector('form').onsubmit=e=>{e.preventDefault();let i=document.querySelector('#message');if(!i.value.trim())return;let agent=selected,p=document.createElement('p');p.className='user sent-message';p.textContent=i.value;(histories[agent]??=[]).push(p);document.querySelector('#history').append(p);i.value='';drafts[agent]='';document.querySelector('#reply-orb').classList.add('busy');setTimeout(()=>{let r=document.createElement('p');r.className='assistant-response';r.textContent='Bien reçu. Je m’en occupe.';histories[agent].push(r);if(selected===agent){document.querySelector('#history').append(r);document.querySelector('#reply-orb').classList.remove('busy');r.scrollIntoView({block:'nearest',behavior:'smooth'})}},650)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('.detail-panel')?.remove();document.querySelector('#menu')?.remove()}});document.addEventListener('change',e=>{if(e.target.id==='motion'){let old=document.querySelector('#motion-style');old?.remove();if(!e.target.checked){let s=document.createElement('style');s.id='
