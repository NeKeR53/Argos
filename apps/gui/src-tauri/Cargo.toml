[package]
name = "argos-gui"
description = "GUI Argos (Tauri) : orbe, console, surfaces"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire (https://github.com/rust-lang/cargo/issues/8519).
name = "argos_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argos-core.workspace = true
argos-voice = { path = "../../../crates/argos-voice" }
tauri = { version = "2", features = ["macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
# Déjà tiré par Tauri : flux d'événements vocaux, signaux de fin, attente de l'essai simulé.
tokio = { version = "1", features = ["macros", "signal", "sync", "time"] }
toml = "1"
# Réécrit un réglage de `config.toml` sans perdre ses commentaires.
toml_edit = "0.25"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
